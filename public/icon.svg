<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background rounded squircle for favicon clarity -->
    <linearGradient id="optinote-static-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="optinote-static-ring" x1="4" y1="44" x2="44" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="optinote-static-fold" x1="20" y1="4" x2="44" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#optinote-static-bg)" />
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#C7D2FE" stroke-opacity="0.8" />

  <!-- Outer Ring "O" -->
  <circle
    cx="24"
    cy="24"
    r="16"
    stroke="url(#optinote-static-ring)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="88 18"
  />

  <!-- Growth Spark / Note Corner Fold -->
  <path
    d="M 27 7 L 40 20 L 30 20 C 28.34 20 27 18.66 27 17 Z"
    fill="url(#optinote-static-fold)"
  />

  <!-- Central Focus Dot -->
  <circle cx="24" cy="24" r="3.5" fill="url(#optinote-static-ring)" />
</svg>
